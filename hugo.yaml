        url: "https://dev.to/aaronwu-builds"

  socialIcons:
    - name: github
      url: "https://github.com/aaronwubuilds"
    - name: linkedin
      url: "https://linkedin.com/company/aaronwubuilds"
    - name: threads
      url: "https://www.threads.net/@aaronwubuilds"
    - name: facebook
      url: "https://www.facebook.com/groups/853321424147631/"
    - name: instagram
      url: "https://instagram.com/aaronwubuilds"
    - name: x
      url: "https://x.com/aaronwubuilds"
    - name: email
      url: "mailto:aaronwubuilds@gmail.com"
    - name: rss
      url: "/index.xml"

