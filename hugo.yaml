baseURL: "https://aaronwubuilds.github.io" 
title: "Aaron Wu"
theme: "PaperMod"

outputs:
  home:
    - HTML
    - RSS
    
enableRobotsTXT: true
buildDrafts: false
buildFuture: false

rssLimit: 100

params:
  defaultTheme: auto
  # 商業 Profile 模式
  profileMode:
    enabled: true
    title: "Aaron Wu"
    subtitle: "Backend Engineer | System Design | Cloud Architecture"
    imageUrl: "/images/logo_v2.jpeg"
    imageWidth: 150
    imageHeight: 150
    buttons:
      - name: GitHub
        url: "https://github.com/aaronwubuilds"
      - name: LinkedIn
        url: "https://linkedin.com/company/aaronwubuilds"
      - name: Email
        url: "mailto:aaronwubuilds@gmail.com"
    assets:
      favicon: "/images/logo_v1.png"
      favicon16x16: "/images/logo_v2.jpeg"
      favicon32x32: "/images/logo_v2.jpeg"
      apple_touch_icon: "/images/logo_v2.jpeg"
    label:
      text: "Aaron Wu"
      icon: "/images/logo_v2.jpeg"
      iconHeight: 35  # 可以調整大小，建議 30-50 之間
  
  # 社交連結（顯示在頁尾）
  socialIcons:
    - name: linkedin
      url: "https://linkedin.com/company/aaronwubuilds"

menu:
  main:
    - identifier: posts
      name: Tech Blog
      url: /posts/
      weight: 10
